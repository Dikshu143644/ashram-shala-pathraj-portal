apiVersion: v1
kind: Secret
metadata:
  name: ashram-shala-secrets
  namespace: ashram-shala
  labels:
    app: ashram-shala-pathraj
type: Opaque
data:
  # To set real values, base64-encode each secret:
  #   echo -n "your-actual-key" | base64
  # Then replace the placeholder values below.

  # Gemini AI API key
  GEMINI_API_KEY: cGxhY2Vob2xkZXI=

  # ElevenLabs API key for text-to-speech
  ELEVENLABS_API_KEY: cGxhY2Vob2xkZXI=

  # ElevenLabs voice ID
  ELEVENLABS_VOICE_ID: cGxhY2Vob2xkZXI=

  # Supabase database URL
  SUPABASE_URL: cGxhY2Vob2xkZXI=

  # Supabase anonymous key
  SUPABASE_ANON_KEY: cGxhY2Vob2xkZXI=

  # WhatsApp Business API token
  WHATSAPP_API_TOKEN: cGxhY2Vob2xkZXI=

  # WhatsApp phone number ID
  WHATSAPP_PHONE_NUMBER_ID: cGxhY2Vob2xkZXI=
