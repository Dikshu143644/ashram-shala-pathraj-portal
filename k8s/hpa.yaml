apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ashram-shala-pathraj
  namespace: ashram-shala
  labels:
    app: ashram-shala-pathraj
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ashram-shala-pathraj
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
