apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ashram-shala-pathraj
  namespace: ashram-shala
  labels:
    app: ashram-shala-pathraj
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - ashram-shala.example.com
      secretName: ashram-shala-tls
  rules:
    - host: ashram-shala.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ashram-shala-pathraj
                port:
                  number: 3000
